name: 'Terraform Deploy - Development'

on:
  push:
    branches: [ dev ]
    paths:
      - 'terraform/**'
      - '.github/workflows/terraform-*.yml'
  pull_request:
    branches: [ dev ]
    paths:
      - 'terraform/**'
      - '.github/workflows/terraform-*.yml'

env:
  TF_VERSION: 1.6.0

jobs:
  terraform-deploy-dev:
    name: 'Terraform Deploy Dev'
    runs-on: ubuntu-latest
    environment: development
    
    defaults:
      run:
        shell: bash
        working-directory: terraform
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    
    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: ${{ env.TF_VERSION }}
    
    - name: Terraform Format Check
      run: terraform fmt -check -recursive
    
    - name: Validate Secrets
      run: |
        echo "Checking if required secrets are available..."
        if [ -z "$TF_VAR_snowflake_account_name" ]; then echo "ERROR: snowflake_account_name not set"; exit 1; fi
        if [ -z "$TF_VAR_snowflake_username" ]; then echo "ERROR: SNOWFLAKE_DEV_USERNAME secret not set"; exit 1; fi
        if [ -z "$TF_VAR_snowflake_password" ]; then echo "ERROR: SNOWFLAKE_DEV_PASSWORD secret not set"; exit 1; fi
        echo "All required secrets are available"
      env:
        TF_VAR_snowflake_account_name: "MS87343"
        TF_VAR_snowflake_organization_name: "JGRVRYQ"
        TF_VAR_snowflake_username: ${{ secrets.SNOWFLAKE_DEV_USERNAME }}
        TF_VAR_snowflake_password: ${{ secrets.SNOWFLAKE_DEV_PASSWORD }}
        TF_VAR_snowflake_role: "TERRAFORM_DEV_ROLE"    
    
    - name: Terraform Init
      run: terraform init
      
    - name: Terraform Validate
      run: terraform validate

    - name: Import Existing Resources
      run: |
        # Import existing database if it exists
        terraform import snowflake_database.main "DEV_DB" || echo "Database import failed or already imported"
        # Import existing warehouse if it exists  
        terraform import snowflake_warehouse.main "DEV_WH" || echo "Warehouse import failed or already imported"
        # Import existing roles if they exist
        terraform import snowflake_account_role.app_role "DEV_APP_ROLE" || echo "App role import failed or already imported"
        terraform import snowflake_account_role.read_role "DEV_READ_ROLE" || echo "Read role import failed or already imported"
      env:
        TF_VAR_environment: "dev"
        TF_VAR_database_name: "DEV_DB"
        TF_VAR_warehouse_name: "DEV_WH"
        TF_VAR_warehouse_size: "X-SMALL"
        TF_VAR_schemas: '["PUBLIC"]'
        TF_VAR_snowflake_account_name: "MS87343"
        TF_VAR_snowflake_organization_name: "JGRVRYQ"
        TF_VAR_snowflake_username: ${{ secrets.SNOWFLAKE_DEV_USERNAME }}
        TF_VAR_snowflake_password: ${{ secrets.SNOWFLAKE_DEV_PASSWORD }}
        TF_VAR_snowflake_role: "TERRAFORM_DEV_ROLE"
    
    - name: Terraform Plan
      run: |
        terraform plan -out=tfplan
      env:
        TF_VAR_environment: "dev"
        TF_VAR_database_name: "DEV_DB"
        TF_VAR_warehouse_name: "DEV_WH"
        TF_VAR_warehouse_size: "X-SMALL"
        TF_VAR_schemas: '["PUBLIC"]'
        TF_VAR_snowflake_account_name: "MS87343"
        TF_VAR_snowflake_organization_name: "JGRVRYQ"
        TF_VAR_snowflake_username: ${{ secrets.SNOWFLAKE_DEV_USERNAME }}
        TF_VAR_snowflake_password: ${{ secrets.SNOWFLAKE_DEV_PASSWORD }}
        TF_VAR_snowflake_role: "TERRAFORM_DEV_ROLE"
    
    - name: Terraform Apply
      run: terraform apply -auto-approve tfplan
      env:
        TF_VAR_environment: "dev"
        TF_VAR_database_name: "DEV_DB"
        TF_VAR_warehouse_name: "DEV_WH"
        TF_VAR_warehouse_size: "X-SMALL"
        TF_VAR_schemas: '["PUBLIC"]'
        TF_VAR_snowflake_account_name: "MS87343"
        TF_VAR_snowflake_organization_name: "JGRVRYQ"
        TF_VAR_snowflake_username: ${{ secrets.SNOWFLAKE_DEV_USERNAME }}
        TF_VAR_snowflake_password: ${{ secrets.SNOWFLAKE_DEV_PASSWORD }}
        TF_VAR_snowflake_role: "TERRAFORM_DEV_ROLE"
