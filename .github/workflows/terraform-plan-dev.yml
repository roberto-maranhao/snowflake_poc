name: 'Terraform Deploy - Development'

on:
  push:
    branches: [ dev ]
    paths:
      - 'terraform/**'
      - '.github/workflows/terraform-*.yml'
  pull_request:
    branches: [ dev ]
    paths:
      - 'terraform/**'
      - '.github/workflows/terraform-*.yml'

env:
  TF_VERSION: 1.6.0

jobs:
  terraform-deploy-dev:
    name: 'Terraform Deploy Dev'
    runs-on: ubuntu-latest
    environment: development
    
    defaults:
      run:
        shell: bash
        working-directory: terraform
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    
    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: ${{ env.TF_VERSION }}
    
    - name: Terraform Format Check
      run: terraform fmt -check -recursive
    
    - name: Terraform Init
      run: |
        terraform init
      env:
        TF_VAR_snowflake_account_name: ${{ secrets.SNOWFLAKE_DEV_ACCOUNT_NAME }}
        TF_VAR_snowflake_organization_name: ${{ secrets.SNOWFLAKE_DEV_ORGANIZATION_NAME }}
        TF_VAR_snowflake_username: ${{ secrets.SNOWFLAKE_DEV_USERNAME }}
        TF_VAR_snowflake_password: ${{ secrets.SNOWFLAKE_DEV_PASSWORD }}
        TF_VAR_snowflake_role: ${{ secrets.SNOWFLAKE_DEV_ROLE }}
    
    - name: Terraform Validate
      run: terraform validate
    
    - name: Terraform Plan
      run: |
        terraform plan -out=tfplan
      env:
        TF_VAR_environment: "dev"
        TF_VAR_database_name: "SNOWFLAKE_DEV"
        TF_VAR_warehouse_name: "COMPUTE_WH_DEV"
        TF_VAR_warehouse_size: "X-SMALL"
        TF_VAR_schemas: '["PUBLIC"]'
        TF_VAR_snowflake_account_name: ${{ secrets.SNOWFLAKE_DEV_ACCOUNT_NAME }}
        TF_VAR_snowflake_organization_name: ${{ secrets.SNOWFLAKE_DEV_ORGANIZATION_NAME }}
        TF_VAR_snowflake_username: ${{ secrets.SNOWFLAKE_DEV_USERNAME }}
        TF_VAR_snowflake_password: ${{ secrets.SNOWFLAKE_DEV_PASSWORD }}
        TF_VAR_snowflake_role: ${{ secrets.SNOWFLAKE_DEV_ROLE }}
    
    - name: Terraform Apply
      run: terraform apply -auto-approve tfplan
      env:
        TF_VAR_environment: "dev"
        TF_VAR_database_name: "SNOWFLAKE_DEV"
        TF_VAR_warehouse_name: "COMPUTE_WH_DEV"
        TF_VAR_warehouse_size: "X-SMALL"
        TF_VAR_schemas: '["PUBLIC"]'
        TF_VAR_snowflake_account_name: ${{ secrets.SNOWFLAKE_DEV_ACCOUNT_NAME }}
        TF_VAR_snowflake_organization_name: ${{ secrets.SNOWFLAKE_DEV_ORGANIZATION_NAME }}
        TF_VAR_snowflake_username: ${{ secrets.SNOWFLAKE_DEV_USERNAME }}
        TF_VAR_snowflake_password: ${{ secrets.SNOWFLAKE_DEV_PASSWORD }}
        TF_VAR_snowflake_role: ${{ secrets.SNOWFLAKE_DEV_ROLE }}
        TF_VAR_snowflake_role: ${{ secrets.SNOWFLAKE_DEV_ROLE }}