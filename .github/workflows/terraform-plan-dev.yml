name: 'Terraform Deploy - Development'

on:
  pull_request:
    branches: [ development ]
    paths:
      - 'terraform/**'
      - 'sql/**'
      - '.github/workflows/terraform-*.yml'

env:
  TF_VERSION: 1.6.0

jobs:
  terraform-deploy-dev:
    name: 'Terraform Deploy Dev'
    runs-on: ubuntu-latest
    environment: development
    
    defaults:
      run:
        shell: bash
        working-directory: terraform/environments/dev
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    
    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: ${{ env.TF_VERSION }}
    
    - name: Terraform Format Check
      run: terraform fmt -check -recursive
    
    - name: Terraform Init
      run: |
        terraform init
      env:
        TF_VAR_snowflake_account: ${{ secrets.SNOWFLAKE_DEV_ACCOUNT }}
        TF_VAR_snowflake_username: ${{ secrets.SNOWFLAKE_DEV_USERNAME }}
        TF_VAR_snowflake_password: ${{ secrets.SNOWFLAKE_DEV_PASSWORD }}
        TF_VAR_snowflake_role: ${{ secrets.SNOWFLAKE_DEV_ROLE }}
    
    - name: Terraform Validate
      run: terraform validate
    
    - name: Terraform Plan
      run: |
        terraform plan -out=tfplan
      env:
        TF_VAR_snowflake_account: ${{ secrets.SNOWFLAKE_DEV_ACCOUNT }}
        TF_VAR_snowflake_username: ${{ secrets.SNOWFLAKE_DEV_USERNAME }}
        TF_VAR_snowflake_password: ${{ secrets.SNOWFLAKE_DEV_PASSWORD }}
        TF_VAR_snowflake_role: ${{ secrets.SNOWFLAKE_DEV_ROLE }}
    
    - name: Terraform Apply
      run: terraform apply -auto-approve tfplan
      env:
        TF_VAR_snowflake_account: ${{ secrets.SNOWFLAKE_DEV_ACCOUNT }}
        TF_VAR_snowflake_username: ${{ secrets.SNOWFLAKE_DEV_USERNAME }}
        TF_VAR_snowflake_password: ${{ secrets.SNOWFLAKE_DEV_PASSWORD }}
        TF_VAR_snowflake_role: ${{ secrets.SNOWFLAKE_DEV_ROLE }}
        
    - name: Deploy SQL Files
      run: |
        echo "Deploying SQL files to development environment..."
        find ../../../sql -name "*.sql" -type f | while read file; do
          echo "Processing SQL file: $file"
        done