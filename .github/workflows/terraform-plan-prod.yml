name: 'Terraform Deploy - Production'

on:
  pull_request:
    branches: [ prod ]
    paths:
      - 'terraform/**'
      - '.github/workflows/terraform-*.yml'

env:
  TF_VERSION: 1.6.0

jobs:
  terraform-deploy-prod:
    name: 'Terraform Deploy Prod'
    runs-on: ubuntu-latest
    environment: production
    
    defaults:
      run:
        shell: bash
        working-directory: terraform/environments/prod
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    
    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: ${{ env.TF_VERSION }}
    
    - name: Terraform Format Check
      run: terraform fmt -check -recursive
    
    - name: Terraform Init
      run: terraform init
      env:
        TF_VAR_snowflake_account: ${{ secrets.SNOWFLAKE_PROD_ACCOUNT }}
        TF_VAR_snowflake_username: ${{ secrets.SNOWFLAKE_PROD_USERNAME }}
        TF_VAR_snowflake_password: ${{ secrets.SNOWFLAKE_PROD_PASSWORD }}
    
    - name: Terraform Validate
      run: terraform validate
    
    - name: Terraform Plan
      run: terraform plan -out=tfplan
      env:
        TF_VAR_snowflake_account: ${{ secrets.SNOWFLAKE_PROD_ACCOUNT }}
        TF_VAR_snowflake_username: ${{ secrets.SNOWFLAKE_PROD_USERNAME }}
        TF_VAR_snowflake_password: ${{ secrets.SNOWFLAKE_PROD_PASSWORD }}
    
    - name: Terraform Apply
      run: terraform apply -auto-approve tfplan
      env:
        TF_VAR_snowflake_account: ${{ secrets.SNOWFLAKE_PROD_ACCOUNT }}
        TF_VAR_snowflake_username: ${{ secrets.SNOWFLAKE_PROD_USERNAME }}
        TF_VAR_snowflake_password: ${{ secrets.SNOWFLAKE_PROD_PASSWORD }}