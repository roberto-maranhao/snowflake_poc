name: 'Terraform Deploy - Production'

on:
  push:
    branches: [ main ]
    paths:
      - 'terraform/**'
      - '.github/workflows/terraform-*.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'terraform/**'
      - '.github/workflows/terraform-*.yml'

env:
  TF_VERSION: 1.6.0

jobs:
  terraform-deploy-prod:
    name: 'Terraform Deploy Prod'
    runs-on: ubuntu-latest
    environment: production
    
    defaults:
      run:
        shell: bash
        working-directory: terraform
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    
    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: ${{ env.TF_VERSION }}
    
    - name: Terraform Format Check
      run: terraform fmt -check -recursive
    
    - name: Validate Secrets
      run: |
        echo "Checking if required secrets are available..."
        if [ -z "$TF_VAR_snowflake_username" ]; then echo "ERROR: SNOWFLAKE_PROD_USERNAME secret not set"; exit 1; fi
        if [ -z "$TF_VAR_snowflake_password" ]; then echo "ERROR: SNOWFLAKE_PROD_PASSWORD secret not set"; exit 1; fi
        echo "All required secrets are available"
      env:
        TF_VAR_snowflake_account_name: "MS87343"
        TF_VAR_snowflake_organization_name: "JGRVRYQ"
        TF_VAR_snowflake_username: ${{ secrets.SNOWFLAKE_PROD_USERNAME }}
        TF_VAR_snowflake_password: ${{ secrets.SNOWFLAKE_PROD_PASSWORD }}
        TF_VAR_snowflake_role: "TERRAFORM_PROD_ROLE"
    
    - name: Terraform Init
      run: terraform init
      
    - name: Terraform Validate
      run: terraform validate
    
    - name: Terraform Plan
      run: |
        terraform plan -out=tfplan
      env:
        TF_VAR_environment: "prod"
        TF_VAR_database_name: "PROD_DB"
        TF_VAR_warehouse_name: "PROD_WH"
        TF_VAR_warehouse_size: "SMALL"
        TF_VAR_schemas: '["PUBLIC"]'
        TF_VAR_snowflake_account_name: "MS87343"
        TF_VAR_snowflake_organization_name: "JGRVRYQ"
        TF_VAR_snowflake_username: ${{ secrets.SNOWFLAKE_PROD_USERNAME }}
        TF_VAR_snowflake_password: ${{ secrets.SNOWFLAKE_PROD_PASSWORD }}
        TF_VAR_snowflake_role: "TERRAFORM_PROD_ROLE"
    
    - name: Terraform Apply
      run: terraform apply -auto-approve tfplan
      env:
        TF_VAR_environment: "prod"
        TF_VAR_database_name: "PROD_DB"
        TF_VAR_warehouse_name: "PROD_WH"
        TF_VAR_warehouse_size: "SMALL"
        TF_VAR_schemas: '["PUBLIC"]'
        TF_VAR_snowflake_account_name: "MS87343"
        TF_VAR_snowflake_organization_name: "JGRVRYQ"
        TF_VAR_snowflake_username: ${{ secrets.SNOWFLAKE_PROD_USERNAME }}
        TF_VAR_snowflake_password: ${{ secrets.SNOWFLAKE_PROD_PASSWORD }}
        TF_VAR_snowflake_role: "TERRAFORM_PROD_ROLE"
